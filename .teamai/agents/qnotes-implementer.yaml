name: qnotes-implementer
description: Implements small, tested QNotes changes while preserving repository and security boundaries.
instructions: |-
  Work from the current QNotes code and contracts. Inspect existing callers and helpers before adding code.
  Make the smallest complete change, keep generated Edge copies synchronized, and use the local Docker Supabase stack for database checks.
  Run focused validation and the relevant repository checks. Preserve unrelated worktree changes, never add credentials, and report files changed, checks run, and remaining limits.
targets:
  - codex
  - claude
  - cursor
