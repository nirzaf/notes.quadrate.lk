name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run test:unit
      - name: Start the ephemeral local stack for navigation smoke
        run: pnpm exec supabase start
      - run: pnpm run local:env
      - run: pnpm run seed:test-users
      - name: Start the configured local functions
        run: |
          pnpm exec supabase functions serve qnotes-api embedding-worker attachment-worker --env-file supabase/functions/.env.test --no-verify-jwt > "$RUNNER_TEMP/qnotes-functions.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/qnotes-functions.pid"
          for attempt in $(seq 1 60); do
            if curl -fsS -H 'Origin: http://127.0.0.1:5173' http://127.0.0.1:54321/functions/v1/qnotes-api/api/health > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - run: pnpm exec playwright install --with-deps chrome
      - run: QNOTES_E2E_EXTERNAL_API=1 QNOTES_E2E_SERVE_WORKERS=0 pnpm exec playwright test tests/e2e/navigation.spec.ts --project=chromium
      - name: Stop the configured local functions
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/qnotes-functions.pid"; then
            kill "$(cat "$RUNNER_TEMP/qnotes-functions.pid")" || true
          fi
      - name: Stop the ephemeral local stack
        if: always()
        run: pnpm exec supabase stop
