name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

env:
  NODE_VERSION: 24.19.0
  DENO_VERSION: 2.9.6
  PNPM_VERSION: 12.1.0

jobs:
  core:
    name: core
    runs-on: [self-hosted, linux, x64, qnotes-ci]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: Enable the pinned package manager
        run: |
          corepack enable
          corepack install --global "pnpm@${PNPM_VERSION}"
          pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test:unit
      - run: pnpm run test:edge
      - run: pnpm run build
      - run: pnpm run verify:edge-shared

  integration:
    # Local Supabase containers are opt-in because some self-hosted gateways do
    # not permit the user namespaces required by the Supabase CLI.
    if: ${{ vars.QNOTES_RUN_LOCAL_SUPABASE == 'true' }}
    name: integration
    runs-on: [self-hosted, linux, x64, qnotes-ci]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: Enable the pinned package manager
        run: |
          corepack enable
          corepack install --global "pnpm@${PNPM_VERSION}"
      - run: pnpm install --frozen-lockfile
      - name: Validate Docker runtime prerequisites
        shell: bash
        run: |
          if ! docker info >/dev/null 2>&1; then
            echo 'Docker daemon is unavailable on this self-hosted runner.'
            exit 1
          fi
          if ! unshare -Ur true >/dev/null 2>&1; then
            echo 'This self-hosted runner cannot create user namespaces required by local Supabase containers.'
            echo 'Use a VM or host with CAP_SYS_ADMIN/user namespaces enabled for the qnotes-ci runner.'
            exit 1
          fi
      - name: Start the local Supabase stack
        run: pnpm exec supabase start
      - run: pnpm run local:env
      - run: pnpm run seed:test-users
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec supabase test db
      - name: Run focused local E2E suites
        run: >-
          pnpm exec playwright test
          tests/e2e/navigation.spec.ts
          tests/e2e/mobile-home.spec.ts
          tests/e2e/attachments.spec.ts
          tests/e2e/public-sharing.spec.ts
          tests/e2e/accessibility.spec.ts
          tests/e2e/oauth-replay.spec.ts
          tests/e2e/workspace-recovery.spec.ts
          --project=chromium
      - name: Stop the local Supabase stack
        if: always()
        run: pnpm exec supabase stop

  search_regression:
    # Enable with the repository Actions variable QNOTES_RUN_LOCAL_SUPABASE=true
    # on a runner that supports local Supabase containers.
    if: ${{ vars.QNOTES_RUN_LOCAL_SUPABASE == 'true' }}
    name: search regression
    runs-on: [self-hosted, linux, x64, qnotes-ci]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Detect search-sensitive changes
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          else
            changed="$(git diff --name-only HEAD^ HEAD)"
          fi
          if printf '%s\n' "$changed" | grep -Eq '^(packages/markdown/|supabase/functions/qnotes-api/search\.ts$|supabase/functions/embedding-worker/|embedding-worker/|supabase/migrations/.*search|tests/search-evaluation-(fixtures|baseline)\.json$|scripts/(evaluate-search|search-evaluation-metrics|verify-search-regression|seed-search-benchmark|search-benchmark)\.mjs$)'; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo 'No search-sensitive files changed; the regression job is intentionally skipped.'
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.scope.outputs.required == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        if: steps.scope.outputs.required == 'true'
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: Enable the pinned package manager
        if: steps.scope.outputs.required == 'true'
        run: |
          corepack enable
          corepack install --global "pnpm@${PNPM_VERSION}"
      - run: pnpm install --frozen-lockfile
        if: steps.scope.outputs.required == 'true'
      - name: Validate Docker runtime prerequisites
        if: steps.scope.outputs.required == 'true'
        shell: bash
        run: |
          if ! docker info >/dev/null 2>&1; then
            echo 'Docker daemon is unavailable on this self-hosted runner.'
            exit 1
          fi
          if ! unshare -Ur true >/dev/null 2>&1; then
            echo 'This self-hosted runner cannot create user namespaces required by local Supabase containers.'
            echo 'Use a VM or host with CAP_SYS_ADMIN/user namespaces enabled for the qnotes-ci runner.'
            exit 1
          fi
      - name: Start the local Supabase stack
        if: steps.scope.outputs.required == 'true'
        run: pnpm exec supabase start
      - run: pnpm run local:env
        if: steps.scope.outputs.required == 'true'
      - name: Start local Edge Functions
        if: steps.scope.outputs.required == 'true'
        shell: bash
        run: |
          nohup pnpm exec supabase functions serve qnotes-api embedding-worker attachment-worker \
            --env-file supabase/functions/.env.test --no-verify-jwt \
            > .tmp/search-functions.log 2>&1 &
          echo $! > .tmp/search-functions.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:54321/functions/v1/qnotes-api/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat .tmp/search-functions.log
          exit 1
      - name: Run the checked-in search baseline
        if: steps.scope.outputs.required == 'true'
        run: pnpm run verify:search -- --seed
      - name: Stop the local Supabase stack
        if: always() && steps.scope.outputs.required == 'true'
        shell: bash
        run: |
          if [ -f .tmp/search-functions.pid ]; then
            kill "$(cat .tmp/search-functions.pid)" 2>/dev/null || true
          fi
          pnpm exec supabase stop

  deploy:
    name: deploy production
    needs: [core]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: [self-hosted, linux, x64, qnotes-ci]
    environment:
      name: production
      url: https://notes.quadrate.lk/
    concurrency:
      group: qnotes-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ciyoandzjezgqxjpcrin
      VITE_SUPABASE_URL: https://ciyoandzjezgqxjpcrin.supabase.co
      VITE_QNOTES_API_URL: https://ciyoandzjezgqxjpcrin.supabase.co/functions/v1/qnotes-api
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable the pinned package manager
        run: |
          corepack enable
          corepack install --global "pnpm@${PNPM_VERSION}"
          pnpm --version
      - run: pnpm install --frozen-lockfile
      - name: Load deployment environment from the runner host
        shell: bash
        run: |
          local_env_file="${QNOTES_CI_ENV_FILE:-/root/Desktop/notes.quadrate.lk/.env.local}"
          if [ ! -r "$local_env_file" ]; then
            echo "Deployment environment file is not readable: $local_env_file"
            exit 1
          fi

          # This file is trusted host configuration, not repository content. Export
          # only the values needed by this job and mask each value before handing it
          # to later steps through GITHUB_ENV.
          set -a
          . "$local_env_file"
          set +a
          for name in \
            SUPABASE_ACCESS_TOKEN \
            SUPABASE_DB_PASSWORD \
            VITE_SUPABASE_PUBLISHABLE_KEY \
            CLOUDFLARE_ACCOUNT_ID \
            CLOUDFLARE_API_TOKEN \
            CLOUDFLARE_API_KEY \
            CLOUDFLARE_EMAIL; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              continue
            fi
            if [[ "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "$name must be a single-line value"
              exit 1
            fi
            printf '::add-mask::%s\n' "$value"
            printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
          done
      - name: Check production deployment secrets
        shell: bash
        run: |
          required=(
            SUPABASE_ACCESS_TOKEN
            SUPABASE_DB_PASSWORD
            VITE_SUPABASE_PUBLISHABLE_KEY
            CLOUDFLARE_ACCOUNT_ID
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required production environment secret: $name"
              exit 1
            fi
          done
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && { \
            [ -z "${CLOUDFLARE_API_KEY:-}" ] || \
            [ -z "${CLOUDFLARE_EMAIL:-}" ]; \
          }; then
            echo "Missing Cloudflare credentials: provide CLOUDFLARE_API_TOKEN or CLOUDFLARE_API_KEY with CLOUDFLARE_EMAIL"
            exit 1
          fi
      - name: Link and preview production migrations
        run: |
          pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_ID" --yes
          pnpm exec supabase db push --linked --dry-run
      - name: Apply production migrations
        run: pnpm exec supabase db push --linked --yes
      - name: Deploy Supabase Edge Functions
        run: >-
          pnpm exec supabase functions deploy
          qnotes-api embedding-worker attachment-worker qnotes-mcp
          --project-ref "$SUPABASE_PROJECT_ID"
          --no-verify-jwt
          --use-api
          --import-map supabase/functions/deno.json
      - name: Build the production frontend
        run: pnpm run build
      - name: Deploy Cloudflare Pages
        run: >-
          npx --yes wrangler@4.128.0 pages deploy apps/web/dist
          --project-name notes-quadrate-lk
          --branch master
          --commit-hash "$GITHUB_SHA"
          --commit-message "$(git log -1 --pretty=%s)"
          --commit-dirty=false
      - name: Verify production endpoints
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 https://notes.quadrate.lk/ >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            https://ciyoandzjezgqxjpcrin.supabase.co/functions/v1/qnotes-api/api/health >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            https://ciyoandzjezgqxjpcrin.supabase.co/functions/v1/qnotes-mcp/health >/dev/null
