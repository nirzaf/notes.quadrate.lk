name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

env:
  NODE_VERSION: 24.19.0
  DENO_VERSION: 2.9.6
  PNPM_VERSION: 12.1.0

jobs:
  core:
    name: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: Enable the pinned package manager
        run: |
          corepack enable
          corepack install --global "pnpm@${PNPM_VERSION}"
          pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test:unit
      - run: pnpm run test:edge
      - run: pnpm run build
      - run: pnpm run verify:edge-shared

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: Enable the pinned package manager
        run: |
          corepack enable
          corepack install --global "pnpm@${PNPM_VERSION}"
      - run: pnpm install --frozen-lockfile
      - name: Build workspace for integration tests
        run: pnpm run build
      - name: Validate Docker runtime prerequisites
        shell: bash
        run: |
          if ! docker info >/dev/null 2>&1; then
            echo 'Docker daemon is unavailable on the GitHub-hosted runner.'
            exit 1
          fi
      - name: Start the local Supabase stack
        run: pnpm exec supabase start
      - run: pnpm run local:env
      - run: pnpm run seed:test-users
      - run: pnpm exec supabase test db
      - name: Stop the local Supabase stack
        if: always()
        run: pnpm exec supabase stop

  search_regression:
    name: search regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect search-sensitive changes
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            changed="$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          else
            changed="$(git diff --name-only HEAD^ HEAD)"
          fi
          if printf '%s\n' "$changed" | grep -Eq '^(packages/markdown/|supabase/functions/qnotes-api/search\.ts$|supabase/functions/embedding-worker/|embedding-worker/|supabase/migrations/.*search|tests/search-evaluation-(fixtures|baseline)\.json$|scripts/(evaluate-search|search-evaluation-metrics|verify-search-regression|seed-search-benchmark|search-benchmark)\.mjs$)'; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo 'No search-sensitive files changed; the regression job is intentionally skipped.'
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.scope.outputs.required == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        if: steps.scope.outputs.required == 'true'
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: Enable the pinned package manager
        if: steps.scope.outputs.required == 'true'
        run: |
          corepack enable
          corepack install --global "pnpm@${PNPM_VERSION}"
      - run: pnpm install --frozen-lockfile
        if: steps.scope.outputs.required == 'true'
      - name: Validate Docker runtime prerequisites
        if: steps.scope.outputs.required == 'true'
        shell: bash
        run: |
          if ! docker info >/dev/null 2>&1; then
            echo 'Docker daemon is unavailable on the GitHub-hosted runner.'
            exit 1
          fi
      - name: Start the local Supabase stack
        if: steps.scope.outputs.required == 'true'
        run: pnpm exec supabase start
      - run: pnpm run local:env
        if: steps.scope.outputs.required == 'true'
      - name: Start local Edge Functions
        if: steps.scope.outputs.required == 'true'
        shell: bash
        run: |
          nohup pnpm exec supabase functions serve qnotes-api embedding-worker attachment-worker \
            --env-file supabase/functions/.env.test --no-verify-jwt \
            > .tmp/search-functions.log 2>&1 &
          echo $! > .tmp/search-functions.pid
          for attempt in {1..60}; do
            : "$attempt"
            if curl --fail --silent http://127.0.0.1:54321/functions/v1/qnotes-api/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat .tmp/search-functions.log
          exit 1
      - name: Run the checked-in search baseline
        if: steps.scope.outputs.required == 'true'
        run: pnpm run verify:search -- --seed
      - name: Stop the local Supabase stack
        if: always() && steps.scope.outputs.required == 'true'
        shell: bash
        run: |
          if [ -f .tmp/search-functions.pid ]; then
            kill "$(cat .tmp/search-functions.pid)" 2>/dev/null || true
          fi
          pnpm exec supabase stop

  browser_smoke:
    name: browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ env.DENO_VERSION }}
      - name: Enable the pinned package manager
        run: |
          corepack enable
          corepack install --global "pnpm@${PNPM_VERSION}"
          pnpm --version
      - run: pnpm install --frozen-lockfile
      - name: Build workspace for browser smoke
        run: pnpm run build
      - name: Install the bundled Chromium browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Validate Docker runtime prerequisites
        shell: bash
        run: |
          if ! docker info >/dev/null 2>&1; then
            echo 'Docker daemon is unavailable on the GitHub-hosted runner.'
            exit 1
          fi
      - name: Start the local Supabase stack
        run: pnpm exec supabase start
      - run: pnpm run local:env
      - run: pnpm run seed:test-users
      - name: Start local Vite for browser smoke
        shell: bash
        run: |
          mkdir -p .tmp
          nohup pnpm --filter @qnotes/web dev --host 127.0.0.1 \
            > .tmp/vite.log 2>&1 &
          echo $! > .tmp/vite.pid
          for attempt in {1..60}; do
            : "$attempt"
            if curl --fail --silent --show-error \
              http://127.0.0.1:5173/ >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat .tmp/vite.pid)" 2>/dev/null; then
              echo 'Vite exited before becoming ready.' >&2
              if [ -f .tmp/vite.log ]; then
                cat .tmp/vite.log
              else
                echo 'Vite log was not created.' >&2
              fi
              exit 1
            fi
            sleep 1
          done
          echo 'Vite did not become ready within 60 seconds.' >&2
          if [ -f .tmp/vite.log ]; then
            cat .tmp/vite.log
          else
            echo 'Vite log was not created.' >&2
          fi
          exit 1
      - name: Start local qnotes-api for browser smoke
        shell: bash
        run: |
          mkdir -p .tmp
          nohup pnpm exec supabase functions serve qnotes-api \
            --env-file supabase/functions/.env.test --no-verify-jwt \
            > .tmp/qnotes-api.log 2>&1 &
          echo $! > .tmp/qnotes-api.pid
          for attempt in {1..60}; do
            : "$attempt"
            if curl --fail --silent --show-error \
              http://127.0.0.1:54321/functions/v1/qnotes-api/api/health >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$(cat .tmp/qnotes-api.pid)" 2>/dev/null; then
              if [ -f .tmp/qnotes-api.log ]; then
                cat .tmp/qnotes-api.log
              else
                echo 'qnotes-api log was not created.' >&2
              fi
              exit 1
            fi
            sleep 1
          done
          if [ -f .tmp/qnotes-api.log ]; then
            cat .tmp/qnotes-api.log
          else
            echo 'qnotes-api log was not created.' >&2
          fi
          exit 1
      - name: Run the bounded browser release smoke suite
        env:
          QNOTES_E2E_EXTERNAL_API: '1'
        run: pnpm run test:e2e:smoke
      - name: Print Vite log on failure
        if: failure()
        shell: bash
        run: |
          if [ -f .tmp/vite.log ]; then
            cat .tmp/vite.log || true
          else
            echo 'Vite log was not created.' >&2
          fi
      - name: Stop local Vite
        if: always()
        shell: bash
        run: |
          if [ -s .tmp/vite.pid ]; then
            vite_pid="$(cat .tmp/vite.pid)"
            if kill -0 "$vite_pid" 2>/dev/null; then
              kill "$vite_pid" 2>/dev/null || true
              for attempt in {1..10}; do
                : "$attempt"
                if ! kill -0 "$vite_pid" 2>/dev/null; then
                  break
                fi
                sleep 1
              done
              kill -KILL "$vite_pid" 2>/dev/null || true
            fi
          fi
      - name: Stop local qnotes-api
        if: always()
        shell: bash
        run: |
          if [ -s .tmp/qnotes-api.pid ]; then
            qnotes_api_pid="$(cat .tmp/qnotes-api.pid)"
            if kill -0 "$qnotes_api_pid" 2>/dev/null; then
              kill "$qnotes_api_pid" 2>/dev/null || true
              for attempt in {1..10}; do
                : "$attempt"
                if ! kill -0 "$qnotes_api_pid" 2>/dev/null; then
                  break
                fi
                sleep 1
              done
              kill -KILL "$qnotes_api_pid" 2>/dev/null || true
            fi
          fi
      - name: Stop the local Supabase stack
        if: always()
        run: pnpm exec supabase stop

  release_gate:
    name: release gate
    needs: [core, integration, search_regression, browser_smoke]
    if: >-
      ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/master' &&
      needs.core.result == 'success' &&
      (needs.integration.result == 'success' || needs.integration.result == 'skipped') &&
      (needs.search_regression.result == 'success' || needs.search_regression.result == 'skipped') &&
      needs.browser_smoke.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Core, integration, search, and browser smoke verification passed.'

  deploy:
    name: deploy production
    needs: [release_gate]
    if: >-
      ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/master' &&
      needs.release_gate.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://notes.quadrate.lk/
    concurrency:
      group: qnotes-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ciyoandzjezgqxjpcrin
      VITE_SUPABASE_URL: https://ciyoandzjezgqxjpcrin.supabase.co
      VITE_QNOTES_API_URL: https://ciyoandzjezgqxjpcrin.supabase.co/functions/v1/qnotes-api
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable the pinned package manager
        run: |
          corepack enable
          corepack install --global "pnpm@${PNPM_VERSION}"
          pnpm --version
      - run: pnpm install --frozen-lockfile
      - name: Check production deployment secrets
        shell: bash
        run: |
          required=(
            SUPABASE_ACCESS_TOKEN
            SUPABASE_DB_PASSWORD
            VITE_SUPABASE_PUBLISHABLE_KEY
            CLOUDFLARE_ACCOUNT_ID
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required production environment secret: $name"
              exit 1
            fi
          done
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] && { \
            [ -z "${CLOUDFLARE_API_KEY:-}" ] || \
            [ -z "${CLOUDFLARE_EMAIL:-}" ]; \
          }; then
            echo "Missing Cloudflare credentials: provide CLOUDFLARE_API_TOKEN or CLOUDFLARE_API_KEY with CLOUDFLARE_EMAIL"
            exit 1
          fi
      - name: Link and preview production migrations
        run: |
          pnpm exec supabase link --project-ref "$SUPABASE_PROJECT_ID" --yes
          pnpm exec supabase db push --linked --dry-run
      - name: Apply production migrations
        run: pnpm exec supabase db push --linked --yes
      - name: Verify production Vault readiness
        run: pnpm run verify:vault
      - name: Deploy Supabase Edge Functions
        run: >-
          pnpm exec supabase functions deploy
          qnotes-api embedding-worker attachment-worker qnotes-mcp
          --project-ref "$SUPABASE_PROJECT_ID"
          --no-verify-jwt
          --use-api
          --import-map supabase/functions/deno.json
      - name: Build the production frontend
        run: pnpm run build
      - name: Deploy Cloudflare Pages
        run: >-
          npx --yes wrangler@4.128.0 pages deploy apps/web/dist
          --project-name notes-quadrate-lk
          --branch master
          --commit-hash "$GITHUB_SHA"
          --commit-message "$(git log -1 --pretty=%s)"
          --commit-dirty=false
      - name: Verify production endpoints
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 https://notes.quadrate.lk/ >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            https://ciyoandzjezgqxjpcrin.supabase.co/functions/v1/qnotes-api/api/health >/dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            https://ciyoandzjezgqxjpcrin.supabase.co/functions/v1/qnotes-mcp/health >/dev/null
